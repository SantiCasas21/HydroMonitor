version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: waterquality-postgres
    environment:
      POSTGRES_DB: WaterQualityDb
      POSTGRES_USER: wateradmin
      POSTGRES_PASSWORD: W@terQu4lity2025!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wateradmin -d WaterQualityDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: waterquality-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "W@terQu4lity2025!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'W@terQu4lity2025!' -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  waterdata-service:
    build:
      context: .
      dockerfile: src/WaterDataService/Dockerfile
    container_name: waterdata-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=WaterQualityDb;Username=wateradmin;Password=W@terQu4lity2025!
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy

  alert-service:
    build:
      context: .
      dockerfile: src/AlertService/Dockerfile
    container_name: alert-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5002
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=WaterQualityAlertsDb;User Id=sa;Password=W@terQu4lity2025!;TrustServerCertificate=True;
      - WaterDataService__BaseUrl=http://waterdata-service:5001
    ports:
      - "5002:5002"
    depends_on:
      sqlserver:
        condition: service_healthy
      waterdata-service:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    container_name: api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
    ports:
      - "5000:5000"
    depends_on:
      - waterdata-service
      - alert-service

volumes:
  pgdata:
  mssqldata:
